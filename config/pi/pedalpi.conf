# Pedal PI service settings, read by the pedalpi-* units. Installed as
# /etc/pedalpi/pedalpi.conf and never overwritten by a later install.

# JACK. JACK_DRIVER=alsa with the audio interface's ALSA name; `aplay -l`
# lists them. Rate and period are starting points to measure (P0.3), not
# chosen values. JACK_DRIVER=dummy runs without audio hardware.
JACK_DRIVER=alsa
JACK_DRIVER_OPTIONS=-d hw:USB -r 48000 -p 128 -n 3
JACK_OPTIONS=-R -P 70

# Which JACK ports the engine's IN and OUT are wired to.
AUDIO_IN_LEFT=system:capture_1
AUDIO_IN_RIGHT=system:capture_2
AUDIO_OUT_LEFT=system:playback_1
AUDIO_OUT_RIGHT=system:playback_2

# The interface. --display drm draws on the HDMI screen without a desktop;
# add --rotate 180 or --touch /dev/input/by-id/... if needed.
UI_OPTIONS=--display drm
